# Helix Languages Configuration
# Language-specific settings and LSP configurations

# Use a line width of 100 for most languages
[language-server]

# TypeScript/JavaScript
[language-server.typescript-language-server]
command = "typescript-language-server"
args = ["--stdio"]
config.hostInfo = "helix"

[language-server.eslint]
command = "vscode-eslint-language-server"
args = ["--stdio"]

# Python
[language-server.pylsp]
command = "pylsp"
config.pylsp.plugins.pycodestyle.enabled = false
config.pylsp.plugins.flake8.enabled = false
config.pylsp.plugins.pylint.enabled = false
config.pylsp.plugins.ruff.enabled = true

[language-server.ruff]
command = "ruff-lsp"

# Rust
[language-server.rust-analyzer]
command = "rust-analyzer"
config.check.command = "clippy"
config.cargo.features = "all"

# Go
[language-server.gopls]
command = "gopls"
config."formatting.gofumpt" = true

# Language configurations
[[language]]
name = "typescript"
language-servers = ["typescript-language-server", "eslint"]
formatter = { command = "prettier", args = ["--parser", "typescript"] }
auto-format = true
indent = { tab-width = 2, unit = "  " }

[[language]]
name = "javascript"
language-servers = ["typescript-language-server", "eslint"]
formatter = { command = "prettier", args = ["--parser", "javascript"] }
auto-format = true
indent = { tab-width = 2, unit = "  " }

[[language]]
name = "tsx"
language-servers = ["typescript-language-server", "eslint"]
formatter = { command = "prettier", args = ["--parser", "typescript"] }
auto-format = true
indent = { tab-width = 2, unit = "  " }

[[language]]
name = "jsx"
language-servers = ["typescript-language-server", "eslint"]
formatter = { command = "prettier", args = ["--parser", "javascript"] }
auto-format = true
indent = { tab-width = 2, unit = "  " }

[[language]]
name = "python"
language-servers = ["ruff", "pylsp"]
formatter = { command = "ruff", args = ["format", "-"] }
auto-format = true
indent = { tab-width = 4, unit = "    " }

[[language]]
name = "rust"
language-servers = ["rust-analyzer"]
formatter = { command = "rustfmt" }
auto-format = true
indent = { tab-width = 4, unit = "    " }

[[language]]
name = "go"
language-servers = ["gopls"]
formatter = { command = "gofumpt" }
auto-format = true
indent = { tab-width = 4, unit = "\t" }

[[language]]
name = "toml"
formatter = { command = "taplo", args = ["fmt", "-"] }
