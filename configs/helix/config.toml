# Helix Configuration
# Modern defaults for a post-modern editor

theme = "tokyonight_storm"

[editor]
# Enable mouse support
mouse = true

# Show line numbers
line-number = "relative"
cursorline = true
cursorcolumn = false

# Enable auto-pairs for brackets, quotes, etc
auto-pairs = true

# Visual guides
rulers = [80, 120]

# Scrolling
scroll-lines = 3
scrolloff = 8

# File handling
auto-save = false
auto-format = true
auto-info = true

# Search
search.smart-case = true
search.wrap-around = true

# Whitespace rendering
[editor.whitespace]
render = { space = "all", tab = "all", newline = "none" }

[editor.whitespace.characters]
space = "·"
nbsp = "⍽"
tab = "→"
newline = "⏎"
tabpad = "·"

# Indent guides
[editor.indent-guides]
render = true
character = "│"
skip-levels = 1

# Git gutter
[editor.gutters]
layout = ["diagnostics", "spacer", "line-numbers", "spacer", "diff"]

# Status line
[editor.statusline]
left = ["mode", "spinner", "version-control", "file-name", "file-modification-indicator"]
center = ["file-encoding", "file-line-ending", "file-type"]
right = ["diagnostics", "selections", "register", "position", "position-percentage"]
separator = "│"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

# LSP configuration
[editor.lsp]
display-messages = true
display-inlay-hints = true
display-signature-help-docs = true
snippets = true
goto-reference-include-declaration = true

# Cursor shape
[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

# File picker
[editor.file-picker]
hidden = false
follow-links = true
deduplicate-links = true
parents = true
ignore = true
git-ignore = true
git-global = true
git-exclude = true
max-depth = 10

# Auto-completion
[editor.auto-completion]
auto-completion = true
idle-timeout = 400
preview-completion-insert = true
completion-trigger-len = 2
completion-replace = false

# Smart tab behavior
[editor.smart-tab]
enable = true
supersede-menu = false

# Soft wrap
[editor.soft-wrap]
enable = false
max-wrap = 20
max-indent-retain = 0
wrap-indicator = ""

# Key remappings for common operations
[keys.normal]
# Quick save
"C-s" = ":w"
# Quick quit
"C-q" = ":q"
# Better split navigation
"C-h" = "jump_view_left"
"C-j" = "jump_view_down"
"C-k" = "jump_view_up"
"C-l" = "jump_view_right"
# Quick buffer switching
"space b" = "buffer_picker"
# File tree
"space e" = ":open ."
# Global search
"space /" = "global_search"
# Format document
"space f" = ":format"
# Symbol picker
"space s" = "symbol_picker"
# Diagnostics
"space d" = "diagnostics_picker"
# Git blame
"space g b" = ":toggle-option gutters.diff"

[keys.insert]
# Exit insert mode with jk
"j k" = "normal_mode"

[keys.select]
# Better selection extending
"x" = "extend_line_below"
"X" = "extend_line_above"