# Kitty Session Template
# Example session file for development projects
# Usage: kitty --session=~/.config/kitty/sessions/dev.conf

# Create a new tab for the main editor
new_tab Editor
cd ~
launch zsh

# Create a new tab for running servers/builds
new_tab Server
cd ~
launch zsh

# Create a new tab for git operations
new_tab Git
cd ~
launch zsh

# Create a split window for monitoring
new_tab Monitor
cd ~
launch zsh
launch --location=vsplit btop

# Focus on the first tab
focus_tab 1

# You can create custom session files in ~/.config/kitty/sessions/
# Examples:
# - web.conf: Frontend development with server, build watch, and browser
# - backend.conf: API server, database client, logs
# - fullstack.conf: Multiple tabs for frontend, backend, database, etc.