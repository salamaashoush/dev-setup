# Only non-default values; `lazygit --config` prints every option. Colours come
# from the terminal's Tokyo Night palette.
gui:
  nerdFontsVersion: "3"
  border: rounded
  showRandomTip: false
  theme:
    # The default selection colour is ANSI blue, which is glaring on Tokyo Night
    selectedLineBgColor:
      - "#283457"

git:
  diffRenderers:
    - command: delta --{{colorScheme}} --paging=never

customCommands:
  - key: <c-r>
    command: gh pr create --fill
    description: Create a pull request
    context: global
    output: terminal
  - key: <c-v>
    command: gh pr view --web
    description: Open the pull request in the browser
    context: global
