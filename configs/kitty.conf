# Kitty Terminal Configuration
# Tokyo Night Storm theme

# ===========================================
# Font
# ===========================================
font_family      CaskaydiaCove Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0
modify_font cell_height 110%

# ===========================================
# Cursor
# ===========================================
cursor_shape block
cursor_blink_interval 0

# ===========================================
# Scrollback
# ===========================================
scrollback_lines 10000

# ===========================================
# Mouse
# ===========================================
mouse_hide_wait 3.0
copy_on_select clipboard
focus_follows_mouse no

# ===========================================
# Performance
# ===========================================
repaint_delay 10
input_delay 3
sync_to_monitor yes

# ===========================================
# Bell
# ===========================================
enable_audio_bell no
visual_bell_duration 0.0

# ===========================================
# Window
# ===========================================
remember_window_size yes
initial_window_width 140c
initial_window_height 40c
window_padding_width 10
placement_strategy center
hide_window_decorations no
confirm_os_window_close 0

# ===========================================
# Tab bar
# ===========================================
tab_bar_edge top
tab_bar_style powerline
tab_bar_align left
tab_powerline_style slanted
tab_title_template "{index}: {title}"

# ===========================================
# Tokyo Night Storm colors
# ===========================================
foreground #c0caf5
background #24283b
background_opacity 0.95
selection_foreground #c0caf5
selection_background #2e3c64

cursor #c0caf5
cursor_text_color #24283b
url_color #73daca

active_border_color #7aa2f7
inactive_border_color #292e42

active_tab_foreground #7aa2f7
active_tab_background #1f2335
active_tab_font_style bold
inactive_tab_foreground #545c7e
inactive_tab_background #292e42
inactive_tab_font_style normal
tab_bar_background #1d202f

# Normal colors
color0 #1d202f
color1 #f7768e
color2 #9ece6a
color3 #e0af68
color4 #7aa2f7
color5 #bb9af7
color6 #7dcfff
color7 #a9b1d6

# Bright colors
color8 #414868
color9 #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5

# ===========================================
# OS specific
# ===========================================
wayland_titlebar_color background
macos_titlebar_color background
macos_option_as_alt yes
linux_display_server auto

# ===========================================
# Clipboard & URLs
# ===========================================
clipboard_control write-clipboard write-primary read-clipboard read-primary
open_url_with default
detect_urls yes
underline_hyperlinks always

# ===========================================
# Shell integration
# ===========================================
shell_integration enabled
allow_remote_control yes

# ===========================================
# Keybindings
# ===========================================
kitty_mod ctrl+shift

# Tabs
map kitty_mod+t new_tab_with_cwd
map kitty_mod+w close_tab
map kitty_mod+right next_tab
map kitty_mod+left previous_tab
map kitty_mod+1 goto_tab 1
map kitty_mod+2 goto_tab 2
map kitty_mod+3 goto_tab 3
map kitty_mod+4 goto_tab 4
map kitty_mod+5 goto_tab 5

# Windows/Splits
map kitty_mod+enter new_window_with_cwd
map kitty_mod+n new_os_window_with_cwd
map kitty_mod+backslash launch --location=vsplit --cwd=current
map kitty_mod+minus launch --location=hsplit --cwd=current
map kitty_mod+h neighboring_window left
map kitty_mod+l neighboring_window right
map kitty_mod+k neighboring_window up
map kitty_mod+j neighboring_window down

# Font size
map kitty_mod+equal change_font_size all +1.0
map kitty_mod+plus change_font_size all +1.0
map kitty_mod+kp_subtract change_font_size all -1.0
map kitty_mod+0 change_font_size all 0

# Scrollback
map kitty_mod+u scroll_page_up
map kitty_mod+d scroll_page_down
map kitty_mod+g scroll_home
map kitty_mod+shift+g scroll_end
