# kitty, the fallback terminal: the same font, colours and split keys as
# Ghostty. Only non-default values; kitty's documentation lists the rest.

font_family      CaskaydiaCove Nerd Font
font_size        14.0
disable_ligatures always

cursor_blink_interval 0
scrollback_lines 10000
copy_on_select clipboard
enable_audio_bell no
confirm_os_window_close 0

window_padding_width 10
enabled_layouts splits,stack
tab_bar_style powerline
tab_powerline_style slanted
macos_titlebar_color background
macos_option_as_alt yes
wayland_titlebar_color background

# Tokyo Night Storm, from folke/tokyonight.nvim extras/kitty
background #24283b
foreground #c0caf5
selection_background #2e3c64
selection_foreground #c0caf5
url_color #73daca
cursor #c0caf5
cursor_text_color #24283b
active_tab_background #7aa2f7
active_tab_foreground #1f2335
inactive_tab_background #292e42
inactive_tab_foreground #545c7e
tab_bar_background #1d202f
active_border_color #7aa2f7
inactive_border_color #292e42
color0 #1d202f
color1 #f7768e
color2 #9ece6a
color3 #e0af68
color4 #7aa2f7
color5 #bb9af7
color6 #7dcfff
color7 #a9b1d6
color8 #414868
color9 #ff899d
color10 #9fe044
color11 #faba4a
color12 #8db0ff
color13 #c7a9ff
color14 #a4daff
color15 #c0caf5
color16 #ff9e64
color17 #db4b4b

# Same splits and pane movement as Ghostty
map ctrl+shift+backslash launch --location=vsplit --cwd=current
map ctrl+shift+minus     launch --location=hsplit --cwd=current
map ctrl+shift+h neighboring_window left
map ctrl+shift+l neighboring_window right
map ctrl+shift+k neighboring_window up
map ctrl+shift+j neighboring_window down
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd
