# Ghostty Terminal Configuration
# High-performance configuration with Tokyo Night Storm theme
# Optimized for both macOS and Linux

# ===========================================
# Font Configuration
# ===========================================
font-family = CaskaydiaCove Nerd Font
font-size = 14
font-thicken = true

# Disable ligatures (optional - remove line to enable)
font-feature = -liga

# ===========================================
# Cursor Configuration
# ===========================================
cursor-style = block
cursor-style-blink = false
cursor-color = #c0caf5

# ===========================================
# Colors - Tokyo Night Storm Theme
# ===========================================
background = #24283b
foreground = #c0caf5
selection-background = #2e3c64
selection-foreground = #c0caf5

# Normal colors (0-7)
palette = 0=#1d202f
palette = 1=#f7768e
palette = 2=#9ece6a
palette = 3=#e0af68
palette = 4=#7aa2f7
palette = 5=#bb9af7
palette = 6=#7dcfff
palette = 7=#a9b1d6

# Bright colors (8-15), from folke/tokyonight.nvim extras/ghostty
palette = 8=#414868
palette = 9=#ff899d
palette = 10=#9fe044
palette = 11=#faba4a
palette = 12=#8db0ff
palette = 13=#c7a9ff
palette = 14=#a4daff
palette = 15=#c0caf5

# ===========================================
# Window Configuration
# ===========================================
window-padding-x = 10
window-padding-y = 10
window-padding-balance = true
window-decoration = auto
window-theme = ghostty
window-save-state = always
window-inherit-working-directory = true
window-inherit-font-size = true

# ===========================================
# Tab Bar
# ===========================================
window-new-tab-position = current

# ===========================================
# Scrollback & Selection
# ===========================================
scrollback-limit = 10000000
copy-on-select = clipboard
selection-clear-on-copy = true
# Programs in the terminal (including over SSH) must ask before reading the clipboard
clipboard-read = ask
clipboard-write = allow
clipboard-trim-trailing-spaces = true

# ===========================================
# Mouse & Interaction
# ===========================================
mouse-hide-while-typing = true
focus-follows-mouse = false
link-url = true

# ===========================================
# Shell Integration
# ===========================================
shell-integration = detect
# ssh-terminfo installs Ghostty's terminfo on hosts you SSH into; ssh-env falls
# back to xterm-256color where that is not possible
shell-integration-features = cursor,sudo,title,ssh-env,ssh-terminfo

# ===========================================
# Performance
# ===========================================
window-vsync = true

# ===========================================
# Quick Terminal (Drop-down Quake-style)
# ===========================================
# Trigger with global hotkey (set in KDE: F12 or Ctrl+`)
quick-terminal-position = top
quick-terminal-screen = main
quick-terminal-animation-duration = 0.12

# Size: 100% width, 40% height from top
quick-terminal-autohide = true

# ===========================================
# macOS Specific
# ===========================================
macos-option-as-alt = true
macos-titlebar-style = tabs
quit-after-last-window-closed = true
quit-after-last-window-closed-delay = 1s

# ===========================================
# Keybindings
# ===========================================
# Split management
keybind = ctrl+shift+backslash=new_split:right
keybind = ctrl+shift+minus=new_split:down
keybind = ctrl+shift+w=close_surface
keybind = ctrl+shift+h=goto_split:left
keybind = ctrl+shift+l=goto_split:right
keybind = ctrl+shift+k=goto_split:top
keybind = ctrl+shift+j=goto_split:bottom

# Ghostty's Linux defaults bind these to goto_split; herdr uses them to focus panes
keybind = ctrl+alt+left=unbind
keybind = ctrl+alt+right=unbind
keybind = ctrl+alt+up=unbind
keybind = ctrl+alt+down=unbind

# Tab management
keybind = ctrl+shift+t=new_tab
keybind = ctrl+tab=next_tab
keybind = ctrl+shift+tab=previous_tab

# Font size
keybind = ctrl+plus=increase_font_size:1
keybind = ctrl+minus=decrease_font_size:1
keybind = ctrl+zero=reset_font_size

# Scrollback
keybind = ctrl+shift+u=scroll_page_up
keybind = ctrl+shift+d=scroll_page_down

# Quick terminal toggle
# F12 to toggle drop-down terminal (works when Ghostty has focus or is running)
# For global hotkey on Linux, set up KDE shortcut to run: ghostty --quick
keybind = f12=toggle_quick_terminal
