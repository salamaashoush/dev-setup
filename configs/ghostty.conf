# Ghostty configuration, shared by macOS and Linux.
# Only non-default values live here: `ghostty +show-config --default --docs`
# lists every option with its default.

theme = TokyoNight Storm
# Bright colours from folke/tokyonight.nvim extras/ghostty; the bundled theme
# repeats the normal colours for 9-14
palette = 8=#414868
palette = 9=#ff899d
palette = 10=#9fe044
palette = 11=#faba4a
palette = 12=#8db0ff
palette = 13=#c7a9ff
palette = 14=#a4daff
selection-background = #2e3c64

font-family = CaskaydiaCove Nerd Font
font-size = 14
font-thicken = true
font-feature = -liga

cursor-style-blink = false

window-padding-x = 10
window-padding-y = 10
window-padding-balance = true
window-save-state = always
# Linux only: colour the GTK header bar from the terminal background
window-theme = ghostty

copy-on-select = clipboard
selection-clear-on-copy = true
mouse-hide-while-typing = true

# ssh-terminfo installs Ghostty's terminfo on hosts you SSH into; ssh-env falls
# back to xterm-256color where that is not possible
shell-integration-features = cursor,sudo,title,ssh-env,ssh-terminfo

quick-terminal-animation-duration = 0.12
# Linux defaults to false because its global shortcut needs system setup
quick-terminal-autohide = true

macos-option-as-alt = true
quit-after-last-window-closed = true
quit-after-last-window-closed-delay = 1s

keybind = ctrl+shift+backslash=new_split:right
keybind = ctrl+shift+minus=new_split:down
keybind = ctrl+shift+w=close_surface
keybind = ctrl+shift+h=goto_split:left
keybind = ctrl+shift+l=goto_split:right
keybind = ctrl+shift+k=goto_split:top
keybind = ctrl+shift+j=goto_split:bottom

# Ghostty's Linux defaults bind these to goto_split; herdr uses them to focus panes
keybind = ctrl+alt+left=unbind
keybind = ctrl+alt+right=unbind
keybind = ctrl+alt+up=unbind
keybind = ctrl+alt+down=unbind

keybind = ctrl+shift+t=new_tab

keybind = ctrl+plus=increase_font_size:1
keybind = ctrl+minus=decrease_font_size:1
keybind = ctrl+zero=reset_font_size

keybind = ctrl+shift+u=scroll_page_up
keybind = ctrl+shift+d=scroll_page_down

# Works while Ghostty is focused; on Linux the global F12 is a KDE shortcut
# that runs ghostty-dropdown
keybind = f12=toggle_quick_terminal
