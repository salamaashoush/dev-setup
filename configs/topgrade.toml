# Topgrade configuration
# https://github.com/topgrade-rs/topgrade

[misc]
# Don't ask for confirmations (no GUI)
assume_yes = true

# Cleanup after update
cleanup = true

# Disable sections that require interaction or are handled elsewhere
disable = ["node", "firmware", "restarts"]

# Commands to run before anything
[pre_commands]
# "Greeting" = "echo 'Starting system upgrade...'"

# Commands to run after everything
[post_commands]
# "Done" = "echo 'System upgrade complete!'"

# Custom commands
[commands]
# "Custom Update" = "echo 'Running custom update'"

[linux]
# Arch Linux
arch_package_manager = "yay"
show_arch_news = true

[brew]
greedy_cask = true
autoremove = true

[git]
pull_predefined = false
# repos = ["~/Projects/*"]
