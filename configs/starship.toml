# Starship prompt, Tokyo Night Storm.
#
# Top-level keys must stay above the first [table]: TOML assigns every key after
# a table header to that table, so a `format` written below [palettes] is
# silently ignored and Starship falls back to its default prompt.
"$schema" = "https://starship.rs/config-schema.json"

palette = "tokyonight_storm"
command_timeout = 500

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$nodejs\
$bun\
$rust\
$python\
$golang\
$docker_context\
$aws\
$kubernetes\
$cmd_duration\
$jobs\
$battery\
$line_break\
$character"""

# https://github.com/folke/tokyonight.nvim (storm)
[palettes.tokyonight_storm]
fg = "#c0caf5"
comment = "#565f89"
blue = "#7aa2f7"
cyan = "#7dcfff"
green = "#9ece6a"
magenta = "#bb9af7"
orange = "#ff9e64"
red = "#f7768e"
yellow = "#e0af68"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[username]
style_user = "bold cyan"
style_root = "bold red"
format = "[$user]($style) "

[hostname]
ssh_only = true
ssh_symbol = " "
style = "bold cyan"
format = "[$ssh_symbol$hostname]($style) "

[directory]
style = "bold blue"
read_only = " 󰌾"
read_only_style = "red"
truncation_length = 3
truncate_to_repo = true
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "bold magenta"
format = "[$symbol$branch]($style) "

[git_state]
style = "bold orange"
format = '[\($state( $progress_current/$progress_total)\)]($style) '

[git_status]
style = "bold yellow"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "=$count"
ahead = "⇡$count"
behind = "⇣$count"
diverged = "⇡$ahead_count⇣$behind_count"
untracked = "?$count"
stashed = "\\$$count"
modified = "!$count"
staged = "+$count"
renamed = "»$count"
deleted = "✘$count"

[nodejs]
symbol = " "
style = "bold green"
format = "[$symbol($version )]($style)"

[bun]
symbol = " "
style = "bold fg"
format = "[$symbol($version )]($style)"

[rust]
symbol = "󱘗 "
style = "bold orange"
format = "[$symbol($version )]($style)"

[python]
symbol = " "
style = "bold yellow"
format = '[$symbol$pyenv_prefix($version )(\($virtualenv\) )]($style)'

[golang]
symbol = " "
style = "bold cyan"
format = "[$symbol($version )]($style)"

[docker_context]
symbol = " "
style = "bold blue"
only_with_files = true
format = "[$symbol$context]($style) "

[aws]
symbol = " "
style = "bold orange"
format = '[$symbol($profile )(\($region\) )]($style)'

[kubernetes]
disabled = false
symbol = "󱃾 "
style = "bold cyan"
format = '[$symbol$context( \($namespace\))]($style) '

[cmd_duration]
min_time = 2000
style = "bold yellow"
format = "[󰔟 $duration]($style) "

[jobs]
style = "bold blue"
format = "[$symbol$number]($style) "

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "

[[battery.display]]
threshold = 20
style = "bold red"
