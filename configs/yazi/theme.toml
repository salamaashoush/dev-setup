# Yazi Tokyo Night Storm Theme

[manager]
cwd = { fg = "#7aa2f7" }

# Hovered
hovered         = { reversed = true }
preview_hovered = { underline = true }

# Find
find_keyword  = { fg = "#f7768e", italic = true }
find_position = { fg = "#c0caf5", bg = "#414868", italic = true }

# Marker
marker_selected = { fg = "#7dcfff", bg = "#3b4261" }
marker_copied   = { fg = "#9ece6a", bg = "#3b4261" }
marker_cut      = { fg = "#ff9e64", bg = "#3b4261" }

# Tab
tab_active   = { fg = "#1a1b26", bg = "#7aa2f7" }
tab_inactive = { fg = "#a9b1d6", bg = "#24283b" }
tab_width    = 1

# Count
count_copied   = { fg = "#1a1b26", bg = "#9ece6a" }
count_cut      = { fg = "#1a1b26", bg = "#ff9e64" }
count_selected = { fg = "#1a1b26", bg = "#7dcfff" }

# Border
border_symbol = "│"
border_style  = { fg = "#565f89" }

# Highlighting
syntect_theme = "~/.config/yazi/tokyonight_storm.tmTheme"

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#414868", bg = "#414868" }

# Mode
mode_normal = { fg = "#1a1b26", bg = "#7aa2f7", bold = true }
mode_select = { fg = "#1a1b26", bg = "#9ece6a", bold = true }
mode_unset  = { fg = "#1a1b26", bg = "#ff9e64", bold = true }

# Progress
progress_label  = { fg = "#c0caf5", bold = true }
progress_normal = { fg = "#7aa2f7", bg = "#414868" }
progress_error  = { fg = "#f7768e", bg = "#414868" }

# Permissions
permissions_t = { fg = "#7aa2f7" }
permissions_r = { fg = "#9ece6a" }
permissions_w = { fg = "#ff9e64" }
permissions_x = { fg = "#f7768e" }
permissions_s = { fg = "#bb9af7" }

[input]
border   = { fg = "#7aa2f7" }
title    = {}
value    = {}
selected = { reversed = true }

[select]
border   = { fg = "#7aa2f7" }
active   = { fg = "#e0af68" }
inactive = {}

[tasks]
border  = { fg = "#7aa2f7" }
title   = {}
hovered = { underline = true }

[which]
cols = 3
mask            = { bg = "#1a1b26" }
cand            = { fg = "#7dcfff" }
rest            = { fg = "#565f89" }
desc            = { fg = "#e0af68" }
separator       = "  "
separator_style = { fg = "#414868" }

[help]
on      = { fg = "#e0af68" }
run     = { fg = "#7dcfff" }
desc    = {}
hovered = { reversed = true }
footer  = { fg = "#565f89", bg = "#24283b" }

[filetype]

rules = [
	# Images
	{ mime = "image/*", fg = "#7dcfff" },

	# Videos
	{ mime = "video/*", fg = "#e0af68" },
	{ mime = "audio/*", fg = "#e0af68" },

	# Archives
	{ mime = "application/zip",             fg = "#bb9af7" },
	{ mime = "application/gzip",            fg = "#bb9af7" },
	{ mime = "application/x-tar",           fg = "#bb9af7" },
	{ mime = "application/x-bzip",          fg = "#bb9af7" },
	{ mime = "application/x-bzip2",         fg = "#bb9af7" },
	{ mime = "application/x-7z-compressed", fg = "#bb9af7" },
	{ mime = "application/x-rar",           fg = "#bb9af7" },

	# Documents
	{ mime = "application/doc",   fg = "#9ece6a" },
	{ mime = "application/pdf",   fg = "#9ece6a" },
	{ mime = "application/rtf",   fg = "#9ece6a" },
	{ mime = "application/vnd.*", fg = "#9ece6a" },

	# Fallback
	{ name = "*", fg = "#c0caf5" },
	{ name = "*/", fg = "#7aa2f7" },
]

[icons]
# Icons with nerdfont

rules = [
	# Programming
	{ name = "*.rs",     text = "", fg = "#ff7a93" },
	{ name = "*.go",     text = "", fg = "#519aba" },
	{ name = "*.cpp",    text = "", fg = "#519aba" },
	{ name = "*.c",      text = "", fg = "#599eff" },
	{ name = "*.py",     text = "", fg = "#ffbc03" },
	{ name = "*.js",     text = "", fg = "#f1e05a" },
	{ name = "*.jsx",    text = "", fg = "#519aba" },
	{ name = "*.ts",     text = "", fg = "#519aba" },
	{ name = "*.tsx",    text = "", fg = "#519aba" },
	{ name = "*.vue",    text = "󰡄", fg = "#41b883" },
	{ name = "*.lua",    text = "", fg = "#51a0cf" },
	{ name = "*.rb",     text = "", fg = "#701516" },
	{ name = "*.java",   text = "", fg = "#cc3e44" },
	{ name = "*.sh",     text = "", fg = "#4d5a5e" },
	{ name = "*.php",    text = "", fg = "#a074c4" },
	
	# Config
	{ name = "*.toml",   text = "", fg = "#9c4221" },
	{ name = "*.yaml",   text = "", fg = "#6d8086" },
	{ name = "*.yml",    text = "", fg = "#6d8086" },
	{ name = "*.json",   text = "", fg = "#cbcb41" },
	{ name = "*.xml",    text = "󰗀", fg = "#e37933" },
	
	# Text
	{ name = "*.md",     text = "", fg = "#ffffff" },
	{ name = "*.txt",    text = "󰈙", fg = "#89e051" },
	{ name = "*.org",    text = "", fg = "#77aa99" },
	
	# Git
	{ name = ".gitignore",    text = "", fg = "#f54d27" },
	{ name = ".gitmodules",   text = "", fg = "#f54d27" },
	{ name = ".gitattributes", text = "", fg = "#f54d27" },
	
	# Build
	{ name = "Makefile",      text = "", fg = "#6d8086" },
	{ name = "CMakeLists.txt", text = "", fg = "#6d8086" },
	{ name = "Cargo.toml",    text = "", fg = "#ff7a93" },
	{ name = "package.json",  text = "", fg = "#e8274b" },
	
	# Archives
	{ name = "*.zip", text = "", fg = "#f47f5a" },
	{ name = "*.tar", text = "", fg = "#f47f5a" },
	{ name = "*.gz",  text = "", fg = "#f47f5a" },
	{ name = "*.7z",  text = "", fg = "#f47f5a" },
	{ name = "*.bz2", text = "", fg = "#f47f5a" },
	
	# Images
	{ name = "*.jpg",  text = "󰈟", fg = "#a074c4" },
	{ name = "*.jpeg", text = "󰈟", fg = "#a074c4" },
	{ name = "*.png",  text = "󰈟", fg = "#a074c4" },
	{ name = "*.gif",  text = "󰈟", fg = "#a074c4" },
	{ name = "*.svg",  text = "󰈟", fg = "#ffe64d" },
	{ name = "*.ico",  text = "󰈟", fg = "#cbcb41" },
	
	# Movies
	{ name = "*.mp4",  text = "", fg = "#fd971f" },
	{ name = "*.mkv",  text = "", fg = "#fd971f" },
	{ name = "*.avi",  text = "", fg = "#fd971f" },
	{ name = "*.mov",  text = "", fg = "#fd971f" },
	{ name = "*.webm", text = "", fg = "#fd971f" },
	
	# Audio
	{ name = "*.mp3",  text = "󰎆", fg = "#00afff" },
	{ name = "*.wav",  text = "󰎆", fg = "#00afff" },
	{ name = "*.flac", text = "󰎆", fg = "#00afff" },
	{ name = "*.ogg",  text = "󰎆", fg = "#00afff" },
	
	# Documents
	{ name = "*.pdf", text = "", fg = "#d30102" },
	{ name = "*.doc", text = "󰈬", fg = "#185abd" },
	{ name = "*.docx", text = "󰈬", fg = "#185abd" },
	{ name = "*.xls", text = "󰈛", fg = "#207245" },
	{ name = "*.xlsx", text = "󰈛", fg = "#207245" },
	{ name = "*.ppt", text = "󰈧", fg = "#d04423" },
	{ name = "*.pptx", text = "󰈧", fg = "#d04423" },
	
	# Default
	{ name = "*",  text = "" },
	{ name = "*/", text = "" },
]