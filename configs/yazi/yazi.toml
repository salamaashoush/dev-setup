# Yazi Configuration
# https://yazi-rs.github.io/

[mgr]
# Sort files naturally
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
# Show hidden files by default
show_hidden = false
show_symlink = true

[preview]
# Maximum size of preview cache
cache_dir = "~/.cache/yazi"
max_width = 600
max_height = 900
# Use ueberzug++ for image preview on Linux, or native on macOS
image_delay = 30
image_filter = "triangle"
image_quality = 75

[opener]
# Default file openers
edit = [
	{ run = '$EDITOR "$@"', desc = "Open with $EDITOR", block = true },
	{ run = 'hx "$@"', desc = "Open with Helix", block = true },
	{ run = 'nvim "$@"', desc = "Open with Neovim", block = true },
	{ run = 'code "$@"', desc = "Open with VS Code", block = true },
]

open = [
	{ run = 'xdg-open "$@"', desc = "Open with default app" },
	{ run = 'open "$@"', desc = "Open with default app (macOS)" },
]

reveal = [
	{ run = 'open -R "$@"', desc = "Reveal in Finder (macOS)" },
	{ run = 'dolphin --select "$@"', desc = "Reveal in Dolphin (KDE)" },
]

extract = [
	{ run = 'unar "$1"', desc = "Extract with unar" },
	{ run = 'tar -xf "$1"', desc = "Extract tar archive" },
]

play = [
	{ run = 'mpv "$@"', desc = "Play with mpv", orphan = true },
	{ run = 'vlc "$@"', desc = "Play with VLC", orphan = true },
]

[open]
prepend_rules = [
	# Text files
	{ url = "*.txt", use = ["edit", "open"] },
	{ url = "*.md", use = ["edit", "open"] },

	# Code files
	{ url = "*.{js,jsx,ts,tsx,json,toml,yaml,yml}", use = ["edit", "open"] },
	{ url = "*.{py,rb,go,rs,c,cpp,h,hpp}", use = ["edit", "open"] },
	{ url = "*.{sh,bash,zsh,fish}", use = ["edit", "open"] },

	# Archives
	{ url = "*.{zip,gz,tar,bz2,7z,rar}", use = ["extract", "open"] },

	# Media
	{ url = "*.{jpg,jpeg,png,gif,webp,svg,ico}", use = ["open"] },
	{ url = "*.{mp4,mkv,avi,mov,webm}", use = ["play", "open"] },
	{ url = "*.{mp3,wav,flac,ogg}", use = ["play", "open"] },

	# Documents
	{ url = "*.{pdf,doc,docx,xls,xlsx,ppt,pptx}", use = ["open"] },

	# Directories
	{ mime = "inode/directory", use = ["open", "edit"] },
]

[log]
enabled = false

[input]
# cd on quit
cd_on_quit = true
# Smart paste behavior
smart_paste = true