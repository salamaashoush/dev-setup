# Yazi Keymap Configuration
# Based on vim-like keybindings with modern enhancements

[manager]
keymap = [
	# Navigation
	{ on = [ "h" ], run = "leave", desc = "Go back to parent directory" },
	{ on = [ "l" ], run = "enter", desc = "Enter directory or open file" },
	{ on = [ "k" ], run = "arrow -1", desc = "Move cursor up" },
	{ on = [ "j" ], run = "arrow 1", desc = "Move cursor down" },
	
	{ on = [ "K" ], run = "arrow -5", desc = "Move cursor up 5 lines" },
	{ on = [ "J" ], run = "arrow 5", desc = "Move cursor down 5 lines" },
	
	{ on = [ "<C-u>" ], run = "arrow -50%", desc = "Move cursor up half page" },
	{ on = [ "<C-d>" ], run = "arrow 50%", desc = "Move cursor down half page" },
	{ on = [ "<C-b>" ], run = "arrow -100%", desc = "Move cursor up one page" },
	{ on = [ "<C-f>" ], run = "arrow 100%", desc = "Move cursor down one page" },
	
	{ on = [ "g", "g" ], run = "arrow -99999999", desc = "Move cursor to the top" },
	{ on = [ "G" ], run = "arrow 99999999", desc = "Move cursor to the bottom" },
	
	# Navigation with Home/End keys
	{ on = [ "<Home>" ], run = "arrow -99999999", desc = "Move cursor to the top" },
	{ on = [ "<End>" ], run = "arrow 99999999", desc = "Move cursor to the bottom" },
	
	# Quick navigation
	{ on = [ "~" ], run = "cd ~", desc = "Go to home directory" },
	{ on = [ "/" ], run = "cd /", desc = "Go to root directory" },
	{ on = [ "g", "d" ], run = "cd ~/Downloads", desc = "Go to Downloads" },
	{ on = [ "g", "D" ], run = "cd ~/Documents", desc = "Go to Documents" },
	{ on = [ "g", "p" ], run = "cd ~/Pictures", desc = "Go to Pictures" },
	{ on = [ "g", "c" ], run = "cd ~/.config", desc = "Go to config directory" },
	
	# Selection
	{ on = [ "<Space>" ], run = [ "select --state=none", "arrow 1" ], desc = "Toggle selection" },
	{ on = [ "v" ], run = "visual_mode", desc = "Enter visual mode" },
	{ on = [ "V" ], run = "visual_mode --unset", desc = "Exit visual mode" },
	{ on = [ "a" ], run = "select_all --state=true", desc = "Select all" },
	{ on = [ "A" ], run = "select_all --state=none", desc = "Deselect all" },
	{ on = [ "<C-a>" ], run = "select_all --state=!all", desc = "Inverse selection" },
	
	# Operations
	{ on = [ "o" ], run = "open", desc = "Open file" },
	{ on = [ "O" ], run = "open --interactive", desc = "Open file interactively" },
	{ on = [ "<Enter>" ], run = "open", desc = "Open file" },
	{ on = [ "<C-Enter>" ], run = "open --interactive", desc = "Open file interactively" },
	
	# File operations
	{ on = [ "y", "y" ], run = "yank", desc = "Copy file(s)" },
	{ on = [ "y", "p" ], run = "copy path", desc = "Copy file path" },
	{ on = [ "y", "n" ], run = "copy name", desc = "Copy file name" },
	{ on = [ "x" ], run = "yank --cut", desc = "Cut file(s)" },
	{ on = [ "p" ], run = "paste", desc = "Paste file(s)" },
	{ on = [ "P" ], run = "paste --force", desc = "Paste file(s) (overwrite)" },
	{ on = [ "-" ], run = "link", desc = "Create symlink" },
	{ on = [ "_" ], run = "link --relative", desc = "Create relative symlink" },
	
	{ on = [ "d", "d" ], run = "remove", desc = "Delete file(s)" },
	{ on = [ "D" ], run = "remove --permanently", desc = "Delete permanently" },
	
	# Create
	{ on = [ "n" ], run = "create", desc = "Create file/directory" },
	{ on = [ "r" ], run = "rename", desc = "Rename file" },
	
	# Find
	{ on = [ "f" ], run = "find --smart", desc = "Find next" },
	{ on = [ "F" ], run = "find --previous --smart", desc = "Find previous" },
	{ on = [ "/" ], run = "find", desc = "Find with pattern" },
	{ on = [ "?" ], run = "find --previous", desc = "Find previous with pattern" },
	
	# Filter
	{ on = [ "s" ], run = "search fd", desc = "Search files" },
	{ on = [ "S" ], run = "search rg", desc = "Search contents" },
	{ on = [ "<C-s>" ], run = "search none", desc = "Cancel search" },
	
	# Tabs
	{ on = [ "t" ], run = "tab_create --current", desc = "Create new tab" },
	{ on = [ "1" ], run = "tab_switch 0", desc = "Switch to tab 1" },
	{ on = [ "2" ], run = "tab_switch 1", desc = "Switch to tab 2" },
	{ on = [ "3" ], run = "tab_switch 2", desc = "Switch to tab 3" },
	{ on = [ "4" ], run = "tab_switch 3", desc = "Switch to tab 4" },
	{ on = [ "5" ], run = "tab_switch 4", desc = "Switch to tab 5" },
	{ on = [ "6" ], run = "tab_switch 5", desc = "Switch to tab 6" },
	{ on = [ "7" ], run = "tab_switch 6", desc = "Switch to tab 7" },
	{ on = [ "8" ], run = "tab_switch 7", desc = "Switch to tab 8" },
	{ on = [ "9" ], run = "tab_switch 8", desc = "Switch to tab 9" },
	
	{ on = [ "[" ], run = "tab_switch -1 --relative", desc = "Previous tab" },
	{ on = [ "]" ], run = "tab_switch 1 --relative", desc = "Next tab" },
	
	{ on = [ "{" ], run = "tab_swap -1", desc = "Swap tab backward" },
	{ on = [ "}" ], run = "tab_swap 1", desc = "Swap tab forward" },
	
	# Settings
	{ on = [ "." ], run = "show_hidden toggle", desc = "Toggle hidden files" },
	{ on = [ "z", "h" ], run = "hidden toggle", desc = "Toggle hidden files" },
	
	# Sort
	{ on = [ ",", "n" ], run = "sort natural", desc = "Sort naturally" },
	{ on = [ ",", "N" ], run = "sort natural --reverse", desc = "Sort naturally (reverse)" },
	{ on = [ ",", "s" ], run = "sort size", desc = "Sort by size" },
	{ on = [ ",", "S" ], run = "sort size --reverse", desc = "Sort by size (reverse)" },
	{ on = [ ",", "m" ], run = "sort modified", desc = "Sort by modified time" },
	{ on = [ ",", "M" ], run = "sort modified --reverse", desc = "Sort by modified time (reverse)" },
	{ on = [ ",", "c" ], run = "sort created", desc = "Sort by created time" },
	{ on = [ ",", "C" ], run = "sort created --reverse", desc = "Sort by created time (reverse)" },
	{ on = [ ",", "e" ], run = "sort extension", desc = "Sort by extension" },
	{ on = [ ",", "E" ], run = "sort extension --reverse", desc = "Sort by extension (reverse)" },
	
	# Shell
	{ on = [ ";" ], run = "shell", desc = "Run shell command" },
	{ on = [ ":" ], run = "shell --block", desc = "Run shell command (block)" },
	{ on = [ "!" ], run = "shell '$SHELL' --block", desc = "Open shell here" },
	
	# Help
	{ on = [ "g", "?" ], run = "help", desc = "Show help" },
	{ on = [ "<F1>" ], run = "help", desc = "Show help" },
	
	# Misc
	{ on = [ "q" ], run = "quit", desc = "Quit" },
	{ on = [ "Q" ], run = "quit --no-cwd-file", desc = "Quit without cd" },
	{ on = [ "<C-z>" ], run = "suspend", desc = "Suspend" },
	{ on = [ "<C-r>" ], run = "refresh", desc = "Refresh" },
]

[tasks]
keymap = [
	{ on = [ "<Esc>" ], run = "close", desc = "Close task manager" },
	{ on = [ "q" ], run = "close", desc = "Close task manager" },
	{ on = [ "k" ], run = "arrow -1", desc = "Move cursor up" },
	{ on = [ "j" ], run = "arrow 1", desc = "Move cursor down" },
	
	{ on = [ "<Enter>" ], run = "inspect", desc = "Inspect task" },
	{ on = [ "x" ], run = "cancel", desc = "Cancel task" },
	
	{ on = [ "~" ], run = "help", desc = "Show help" },
	{ on = [ "<F1>" ], run = "help", desc = "Show help" },
]

[select]
keymap = [
	{ on = [ "<Esc>" ], run = "close", desc = "Cancel selection" },
	{ on = [ "q" ], run = "close", desc = "Cancel selection" },
	{ on = [ "<Enter>" ], run = "close --submit", desc = "Submit selection" },
	
	{ on = [ "k" ], run = "arrow -1", desc = "Move cursor up" },
	{ on = [ "j" ], run = "arrow 1", desc = "Move cursor down" },
	
	{ on = [ "K" ], run = "arrow -5", desc = "Move cursor up 5 lines" },
	{ on = [ "J" ], run = "arrow 5", desc = "Move cursor down 5 lines" },
	
	{ on = [ "~" ], run = "help", desc = "Show help" },
	{ on = [ "<F1>" ], run = "help", desc = "Show help" },
]

[input]
keymap = [
	{ on = [ "<Esc>" ], run = "close", desc = "Cancel input" },
	{ on = [ "<Enter>" ], run = "close --submit", desc = "Submit input" },
	
	# Cursor movement
	{ on = [ "<Left>" ], run = "move -1", desc = "Move cursor left" },
	{ on = [ "<Right>" ], run = "move 1", desc = "Move cursor right" },
	{ on = [ "<C-a>" ], run = "move -999", desc = "Move to start" },
	{ on = [ "<C-e>" ], run = "move 999", desc = "Move to end" },
	
	{ on = [ "<C-b>" ], run = "move -1", desc = "Move cursor left" },
	{ on = [ "<C-f>" ], run = "move 1", desc = "Move cursor right" },
	
	# Deletion
	{ on = [ "<Backspace>" ], run = "backspace", desc = "Delete backward" },
	{ on = [ "<Delete>" ], run = "backspace --under", desc = "Delete forward" },
	{ on = [ "<C-h>" ], run = "backspace", desc = "Delete backward" },
	{ on = [ "<C-d>" ], run = "backspace --under", desc = "Delete forward" },
	
	{ on = [ "<C-w>" ], run = "kill word", desc = "Kill word backward" },
	{ on = [ "<C-k>" ], run = "kill bol", desc = "Kill to start of line" },
	{ on = [ "<C-u>" ], run = "kill eol", desc = "Kill to end of line" },
	{ on = [ "<A-d>" ], run = "kill word --under", desc = "Kill word forward" },
	
	# History
	{ on = [ "<Up>" ], run = "history -1", desc = "Previous history" },
	{ on = [ "<Down>" ], run = "history 1", desc = "Next history" },
	{ on = [ "<C-p>" ], run = "history -1", desc = "Previous history" },
	{ on = [ "<C-n>" ], run = "history 1", desc = "Next history" },
]

[completion]
keymap = [
	{ on = [ "<Tab>" ], run = "arrow 1", desc = "Next completion" },
	{ on = [ "<S-Tab>" ], run = "arrow -1", desc = "Previous completion" },
	
	{ on = [ "<C-n>" ], run = "arrow 1", desc = "Next completion" },
	{ on = [ "<C-p>" ], run = "arrow -1", desc = "Previous completion" },
	
	{ on = [ "<Enter>" ], run = "close --submit", desc = "Submit completion" },
	{ on = [ "<Esc>" ], run = "close", desc = "Cancel completion" },
	{ on = [ "<C-q>" ], run = "close", desc = "Cancel completion" },
]

[help]
keymap = [
	{ on = [ "<Esc>" ], run = "escape", desc = "Close help" },
	{ on = [ "q" ], run = "close", desc = "Close help" },
	
	# Navigation
	{ on = [ "k" ], run = "arrow -1", desc = "Move cursor up" },
	{ on = [ "j" ], run = "arrow 1", desc = "Move cursor down" },
	
	{ on = [ "K" ], run = "arrow -5", desc = "Move cursor up 5 lines" },
	{ on = [ "J" ], run = "arrow 5", desc = "Move cursor down 5 lines" },
	
	{ on = [ "<Up>" ], run = "arrow -1", desc = "Move cursor up" },
	{ on = [ "<Down>" ], run = "arrow 1", desc = "Move cursor down" },
	
	{ on = [ "/" ], run = "filter", desc = "Filter help" },
]